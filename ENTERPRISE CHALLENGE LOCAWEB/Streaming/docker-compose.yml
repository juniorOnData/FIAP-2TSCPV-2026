services:

  # =========================================================
  # APACHE KAFKA - KRaft
  # =========================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      # 19092 = comunicação interna Docker
      # 9092  = acesso pela máquina host
      # 29093 = controller KRaft
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # POC com apenas 1 broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Criação controlada pelos scripts
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - ola-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


  # =========================================================
  # CRIAÇÃO DOS TÓPICOS KAFKA
  # =========================================================
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        set -e

        echo "========================================="
        echo "CRIANDO TOPICOS KAFKA"
        echo "========================================="

        echo "Criando ola.events.raw..."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic ola.events.raw \
          --partitions 3 \
          --replication-factor 1

        echo "Criando ola.predictions..."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic ola.predictions \
          --partitions 3 \
          --replication-factor 1

        echo "Criando ola.alerts..."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic ola.alerts \
          --partitions 3 \
          --replication-factor 1

        echo "Criando ola.dlq..."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic ola.dlq \
          --partitions 1 \
          --replication-factor 1

        echo ""
        echo "========================================="
        echo "TOPICOS DISPONIVEIS"
        echo "========================================="

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --list

        echo ""
        echo "Kafka inicializado com sucesso."

    networks:
      - ola-network

    restart: "no"


  # =========================================================
  # KAFKA UI
  # =========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: "ola-streaming"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:19092"
      DYNAMIC_CONFIG_ENABLED: "true"

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - ola-network

    restart: unless-stopped


  # =========================================================
  # MODEL SERVICE
  # MLflow + Databricks + modelo Champion
  # =========================================================
  model-service:
    build:
      context: ./model-service
      dockerfile: Dockerfile

    container_name: model-service
    hostname: model-service

    env_file:
      - .env

    ports:
      - "8000:8000"

    networks:
      - ola-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

    restart: unless-stopped


  # =========================================================
  # INICIALIZAÇÃO DOS VOLUMES DO FLINK
  # =========================================================
  flink-init:
    build:
      context: ./flink
      dockerfile: Dockerfile

    container_name: flink-init

    user: root

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        set -e

        echo "========================================="
        echo "CONFIGURANDO VOLUMES DO FLINK"
        echo "========================================="

        mkdir -p /opt/flink/checkpoints
        mkdir -p /opt/flink/savepoints

        chown -R flink:flink /opt/flink/checkpoints
        chown -R flink:flink /opt/flink/savepoints

        chmod -R 775 /opt/flink/checkpoints
        chmod -R 775 /opt/flink/savepoints

        echo ""
        echo "Permissoes configuradas."

        ls -ld /opt/flink/checkpoints
        ls -ld /opt/flink/savepoints

    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints

    networks:
      - ola-network

    restart: "no"


  # =========================================================
  # FLINK JOB MANAGER
  # =========================================================
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile

    container_name: flink-jobmanager
    hostname: flink-jobmanager

    command: jobmanager

    ports:
      - "8081:8081"

    env_file:
      - .env

    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0

        parallelism.default: 2

        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints

        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: EXACTLY_ONCE

    volumes:
      - ./flink/jobs:/opt/flink/jobs

      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints

    depends_on:
      kafka:
        condition: service_healthy

      flink-init:
        condition: service_completed_successfully

    networks:
      - ola-network

    restart: unless-stopped


  # =========================================================
  # FLINK TASK MANAGER
  # =========================================================
  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile

    container_name: flink-taskmanager
    hostname: flink-taskmanager

    command: taskmanager

    env_file:
      - .env

    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager

        taskmanager.numberOfTaskSlots: 2

        parallelism.default: 2

        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints

        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: EXACTLY_ONCE

    volumes:
      - ./flink/jobs:/opt/flink/jobs

      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints

    depends_on:
      flink-init:
        condition: service_completed_successfully

      flink-jobmanager:
        condition: service_started

    networks:
      - ola-network

    restart: unless-stopped


# =========================================================
# REDE
# =========================================================
networks:

  ola-network:
    name: ola-network
    driver: bridge


# =========================================================
# VOLUMES
# =========================================================
volumes:

  kafka_data:
    name: ola_kafka_data

  flink_checkpoints:
    name: ola_flink_checkpoints

  flink_savepoints:
    name: ola_flink_savepoints